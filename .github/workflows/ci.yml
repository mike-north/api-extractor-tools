name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede obsolete PR runs while allowing each main run to trigger release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            ci-cache-version.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This lane can run on a fresh checkout without waiting for package builds.
      - name: Check workspace
        run: pnpm check:workspace

      - name: Test workspace scripts
        run: pnpm test:workspace

  build-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files_yaml: |
            markdown:
              - '**/*.md'
            non_markdown:
              - '**'
              - '!**/*.md'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            ci-cache-version.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build declaration-file-normalizer first
        run: pnpm --filter @api-extractor-tools/declaration-file-normalizer build

      # Nx's local task cache is machine-specific. Sharing results across runners
      # requires a remote cache backend.
      - name: Build
        run: pnpm build

      - name: Test Node package entry points
        run: pnpm test:entrypoints

      - name: Check built packages
        run: pnpm check:packages

      - name: Test with coverage
        if: steps.changed-files.outputs.non_markdown_any_changed == 'true'
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: steps.changed-files.outputs.non_markdown_any_changed == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            tools/change-detector/coverage/coverage-final.json,
            tools/change-detector-core/coverage/coverage-final.json,
            tools/module-declaration-merger/coverage/coverage-final.json,
            tools/changeset-change-detector/coverage/coverage-final.json,
            tools/change-detector-semantic-release-plugin/coverage/coverage-final.json
          flags: change-detector,change-detector-core,module-declaration-merger,changeset-change-detector,change-detector-semantic-release-plugin
          fail_ci_if_error: false
          verbose: true

  # Preserve the required check name and report an unsuccessful lane even when
  # GitHub would normally skip jobs that depend on it.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [source-checks, build-checks]
    if: ${{ always() }}

    steps:
      - name: Require both CI lanes to succeed
        env:
          SOURCE_CHECKS_RESULT: ${{ needs.source-checks.result }}
          BUILD_CHECKS_RESULT: ${{ needs.build-checks.result }}
        run: |
          echo "Source checks: $SOURCE_CHECKS_RESULT"
          echo "Build and coverage checks: $BUILD_CHECKS_RESULT"
          test "$SOURCE_CHECKS_RESULT" = success && test "$BUILD_CHECKS_RESULT" = success
